<div class="overlay" id="loginModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button class="close" data-close aria-label="Close">&times;</button>
    <h2 id="loginTitle">Sign in</h2>
    <p class="sub">Use your Hope, Inc. ERP account.</p>
    <form data-form="login">
      <div class="field">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" name="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required>
      </div>
      <button type="submit" class="btn btn-solid btn-full">Sign in</button>
      <p class="note" role="status" hidden></p>
    </form>
    <p class="switch">No account yet? <a href="#" data-switch="register">Register</a></p>
  </div>
</div>

<div class="overlay" id="registerModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
    <button class="close" data-close aria-label="Close">&times;</button>
    <h2 id="registerTitle">Register</h2>
    <p class="sub">Create your Hope, Inc. ERP account.</p>
    <p class="hint">New accounts start as pending. An admin has to approve you before you can sign in.</p>
    <form data-form="register">
      <div class="row">
        <div class="field">
          <label for="regFirst">First name</label>
          <input type="text" id="regFirst" name="first_name" required>
        </div>
        <div class="field">
          <label for="regLast">Last name</label>
          <input type="text" id="regLast" name="last_name" required>
        </div>
      </div>
      <div class="field">
        <label for="regEmail">Email address</label>
        <input type="email" id="regEmail" name="email" placeholder="you@company.com" required>
      </div>
      <button type="submit" class="btn btn-solid btn-full">Register</button>
      <p class="note" role="status" hidden></p>
    </form>
    <p class="switch">Already registered? <a href="#" data-switch="login">Sign in</a></p>
  </div>
</div>
